# The intake-desk example: the whole ecosystem in one run. It is a separate
# workspace (docs/adr/0004-ecosystem-example-workspace.md): harvest-camel
# turns on the autumn-web default features (libpq, SQLite) and needs Rust
# 1.89. The plugin keeps no default features and MSRV 1.88.
[package]
name = "autumn-plugin-linear-example-intake-desk"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[workspace]

[[bin]]
name = "intake_desk"
path = "src/main.rs"

[dependencies]
autumn-plugin-linear = { path = "../.." }
autumn-web = "0.9"
autumn-harvest = "0.8.0"
autumn-harvest-plugin = { version = "0.8.0", features = ["connectors"] }
harvest-camel = "0.2.0"
camel-api = "0.57"
camel-builder = "0.57"
camel-component-direct = "0.57"
camel-core = "0.57"
san-mateo = "0.1"
san-mateo-camel = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
wiremock = "0.6"
tokio-util = { version = "0.7", features = ["rt"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
redundant_pub_crate = "allow"
module_name_repetitions = "allow"
